name: Bench host checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  mcsdk-clear-ack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_mcsdk_clear_ack.py
