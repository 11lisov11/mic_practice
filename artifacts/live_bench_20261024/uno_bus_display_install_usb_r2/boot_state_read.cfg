# Read-only snapshot: no reset, halt, or memory writes.
reset_config none
init
echo "BOOT_HEADER_BEGIN"
echo [read_memory 0x08100000 32 4]
echo "BOOT_HEADER_END"
echo "LLEXT_LIST_BEGIN"
echo [read_memory 0x20001780 32 2]
echo "LLEXT_LIST_END"
echo "BACKUP_BEGIN"
echo [read_memory 0x40036400 32 1]
echo "BACKUP_END"
echo "FAULT_STATUS_BEGIN"
echo [read_memory 0xE000ED28 32 2]
echo "FAULT_STATUS_END"
echo "CORE_STATE: [$_TARGETNAME curstate]"
shutdown
