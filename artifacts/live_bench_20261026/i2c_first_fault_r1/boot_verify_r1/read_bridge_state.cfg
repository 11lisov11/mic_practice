reset_config none
init
set ext [lindex [read_memory 0x20001780 32 2] 0]
if {$ext >= 0x20000000 && $ext < 0x200c0000} {
 echo "LLEXT_BEGIN: [read_memory $ext 32 40]"
 set mem [read_memory [expr {$ext+20}] 32 12]
 set bss [lindex $mem 3]
 echo "BSS_BASE: $bss"
 if {$bss >= 0x20000000 && $bss < 0x200c0000} {
  echo "BRIDGE_FLAGS: [read_memory [expr {$bss+0xdd8}] 8 16]"
  echo "CONTROL_MUTEX: [read_memory [expr {$bss+0x156c}] 32 5]"
  echo "BRIDGE_OBJECT: [read_memory [expr {$bss+0x2b48}] 32 90]"
  echo "SERVICE_THREAD: [read_memory [expr {$bss+0xcc0}] 32 66]"
 }
}
shutdown
