reset_config none
init
set ext [lindex [read_memory 0x20001780 32 1] 0]
set bss [lindex [read_memory [expr {$ext+20}] 32 4] 3]
set bridge [expr {$bss+11096}]
echo "BRIDGE: [read_memory $bridge 32 15]"
echo "HEALTH: [read_memory [expr {$bss+10508}] 32 4]"
set client [lindex [read_memory $bridge 32 1] 0]
if {$client>=0x20000000 && $client<0x200c0000} {
 set decoder [lindex [read_memory $client 32 1] 0]
 echo "DECODER: [read_memory $decoder 8 1056]"
}
echo "TICK: [read_memory 0x200016b0 32 2]"
echo "UART: [read_memory 0x46002400 32 9]"
shutdown
