reset_config none
init
for {set n 0} {$n<24} {incr n} {
 set ext [lindex [read_memory 0x20001780 32 1] 0]
 if {$ext>=0x20000000 && $ext<0x200c0000} {
  set bss [lindex [read_memory [expr {$ext+20}] 32 4] 3]
  echo "CYCLE $n TICK [read_memory 0x200016b0 32 2] BRIDGE [read_memory [expr {$bss+0x2b58}] 32 4] HEALTH [read_memory [expr {$bss+0x290c}] 32 4] FLAGS [read_memory [expr {$bss+0xdd8}] 8 8]"
 }
 sleep 500
}
shutdown
