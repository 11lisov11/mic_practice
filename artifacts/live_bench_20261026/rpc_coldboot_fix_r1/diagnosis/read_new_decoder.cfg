reset_config none
init
set ext [lindex [read_memory 0x20001780 32 2] 0]
if {$ext >= 0x20000000 && $ext < 0x200c0000} {
 set mem [read_memory [expr {$ext+20}] 32 12]
 set bss [lindex $mem 3]
 echo "MEM_REGIONS: $mem"
 if {$bss >= 0x20000000 && $bss < 0x200c0000} {
  set bridge [expr {$bss+0x2b58}]
  set client [lindex [read_memory $bridge 32 1] 0]
  set decoder [lindex [read_memory $client 32 1] 0]
  echo "RPC_DECODER_ADDR: $decoder"
  echo "RPC_DECODER_BYTES: [read_memory $decoder 8 1056]"
  echo "BRIDGE_FLAGS: [read_memory [expr {$bss+0xdd8}] 8 16]"
  echo "RPC_HEALTH: [read_memory [expr {$bss+0x290c}] 32 4]"
  echo "CONTROL_MUTEX: [read_memory [expr {$bss+0x156c}] 32 5]"
 }
}
shutdown
