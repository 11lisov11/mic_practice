reset_config none
init
echo "TICK_A: [read_memory 0x200016b0 32 2]"
echo "KERNEL: [read_memory 0x20001e30 32 10]"
echo "MAIN_THREAD: [read_memory 0x20001360 32 66]"
set psp [lindex [read_memory 0x200013b0 32 1] 0]
if {$psp>=0x20000000 && $psp<0x200c0000} {echo "MAIN_STACK: [read_memory $psp 32 40]"}
halt
echo "PC: [reg pc]"
echo "LR: [reg lr]"
echo "XPSR: [reg xpsr]"
resume
sleep 500
echo "TICK_B: [read_memory 0x200016b0 32 2]"
shutdown
