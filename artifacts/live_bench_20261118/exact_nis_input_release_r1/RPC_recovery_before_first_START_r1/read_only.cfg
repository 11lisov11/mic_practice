# Passive evidence only: suppress target's usual examine hooks; never reset/halt/write.
$_CHIPNAME.ap0 configure -event examine-end {}
$_TARGETNAME configure -event examine-end {}
init
echo "CORE_BEFORE: [$_TARGETNAME curstate]"
echo "FAULT_REGISTERS: [read_memory 0xE000ED28 32 6]"
dump_image /tmp/mic1801_rpc_before_first_START.bin 0x20000000 0xC0000
echo "CORE_AFTER: [$_TARGETNAME curstate]"
shutdown
