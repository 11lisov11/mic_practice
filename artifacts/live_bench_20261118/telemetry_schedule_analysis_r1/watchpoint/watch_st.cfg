adapter serial 003A002C3335510933383531
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
reset halt
bp 0x8008dd8 2 hw
resume
wait_halt 3000
rbp 0x8008dd8
echo BOOT_BEFORE_WATCH
mdw 0x200078ec 8
wp 0x200078ec 4 w
set observed [catch {
 resume
 wait_halt 7000
 echo WRITE_CAUGHT
 reg pc
 reg sp
 reg lr
 reg xpsr
 mdw 0x200078ec 8
 mdw 0x200078c0 80
} err]
echo "WATCH_RESULT $observed $err"
rwp 0x200078ec
rbp 0x8008dd8
resume
shutdown
