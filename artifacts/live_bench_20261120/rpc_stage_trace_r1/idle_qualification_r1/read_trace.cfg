$_CHIPNAME.ap0 configure -event examine-end {}
$_TARGETNAME configure -event examine-end {}
init
echo "CORE_BEFORE: [$_TARGETNAME curstate]"
set x [lindex [read_memory 0x20001780 32 1] 0]
if {$x < 0x20000000 || $x >= 0x200c0000} {shutdown error}
set base [lindex [read_memory [expr {$x+24}] 32 1] 0]
set ptr [expr {$base+52}]
if {$ptr < 0x20000000 || $ptr+4112 > 0x200c0000} {shutdown error}
if {[lindex [read_memory $ptr 32 1] 0] != 0x31545052} {shutdown error}
echo "TRACE: $ptr"
dump_image /tmp/mic_rpc2011_idle_read_20261120_r1/trace.bin $ptr 4112
dump_image /tmp/mic_rpc2011_idle_read_20261120_r1/trace2.bin $ptr 4112
echo "CORE_AFTER: [$_TARGETNAME curstate]"
shutdown
