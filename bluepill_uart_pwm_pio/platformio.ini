[env:bluepill_uart_pwm]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
build_src_filter = +<*> -<relay_test.cpp> -<pwm_selftest.cpp> -<pwm_static_low_test.cpp> -<thermal_diag.cpp>

[env:bluepill_uart_pwm_serial]
extends = env:bluepill_uart_pwm
upload_protocol = serial

[env:bluepill_uart_pwm_bench_no_temp]
extends = env:bluepill_uart_pwm
build_flags =
    -DHEATSINK_TEMP_PROTECTION_ENABLE=0
    -DBENCH_NO_HEATSINK_SENSOR=1

[env:bluepill_relay_test]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
build_src_filter = +<relay_test.cpp>

[env:bluepill_pwm_selftest]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
build_src_filter = +<pwm_selftest.cpp> +<pwm_tim1.cpp>

[env:bluepill_static_low_test]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
build_src_filter = +<pwm_static_low_test.cpp>

[env:bluepill_thermal_diag]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
build_src_filter = +<thermal_diag.cpp>
build_flags = -DTHERMAL_DIAG_UART=0

[env:bluepill_thermal_diag_uart]
extends = env:bluepill_thermal_diag
build_flags = -DTHERMAL_DIAG_UART=1
