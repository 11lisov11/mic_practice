# Use with the Arduino Zephyr remoteocd recipe (filename0=loader, filename1=sketch).
# Verification only: do not erase or program flash.
reset_config srst_only srst_nogate srst_push_pull connect_assert_srst
init
reset
halt
set verify_failed [catch {
    flash verify_image ${filename0}
    flash verify_image ${filename1} 0x08100000 bin
} verify_error]
reset
sleep 100
mww 0x40036400 0xCAFFEEEE
if {$verify_failed} {
    echo "UNO Q verification FAILED: $verify_error"
    shutdown error
} else {
    echo "UNO Q loader and sketch verification PASSED"
    shutdown
}
