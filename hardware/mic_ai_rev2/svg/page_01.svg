<text x="603.00" y="751.89" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#9a5a0d">НЕТ медного соединения земель</text>
<rect x="665.00" y="171.89" width="215.00" height="105.00" rx="6" fill="#fffafa" stroke="#a32b28" stroke-width="1.8"/>
<text x="675.00" y="189.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">Blue Pill</text>
<text x="675.00" y="207.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">Питание только HOT_3V3</text>
<text x="675.00" y="219.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">USART2 PA2/PA3</text>
<text x="675.00" y="230.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">TIM1 PWM + safety</text>
<text x="675.00" y="242.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">HOT_GND = HV_DC-</text>
<rect x="920.00" y="171.89" width="205.00" height="105.00" rx="6" fill="#fffafa" stroke="#a32b28" stroke-width="1.8"/>
<text x="930.00" y="189.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">STEVAL-IPM15B</text>
<text x="930.00" y="207.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">J2 signals + J4 15V</text>
<text x="930.00" y="219.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">J7: 125..400VDC</text>
<text x="930.00" y="230.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">J2 GND = J7 DC-</text>
<text x="930.00" y="242.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">Внутри закрытого корпуса</text>
<rect x="665.00" y="326.89" width="215.00" height="105.00" rx="6" fill="#fffafa" stroke="#a32b28" stroke-width="1.8"/>
<text x="675.00" y="344.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">AS5600</text>
<text x="675.00" y="362.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">PB10 SCL / PB11 SDA</text>
<text x="675.00" y="374.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">HOT_3V3 / HOT_GND</text>
<text x="675.00" y="385.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">Кабель и модуль недоступны</text>
<text x="675.00" y="397.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">при включенной HV</text>
<rect x="920.00" y="326.89" width="205.00" height="105.00" rx="6" fill="#fffafa" stroke="#a32b28" stroke-width="1.8"/>
<text x="930.00" y="344.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">4-pin PWM fan</text>
<text x="930.00" y="362.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">HOT_12V постоянно</text>
<text x="930.00" y="374.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">PB3 -&gt; NPN open collector</text>
<text x="930.00" y="385.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">PA11 TACH</text>
<text x="930.00" y="397.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">3-pin: только полная скорость</text>
<rect x="665.00" y="486.89" width="460.00" height="110.00" rx="6" fill="#fffafa" stroke="#a32b28" stroke-width="1.8"/>
<text x="675.00" y="504.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">Силовое питание</text>
<text x="675.00" y="522.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">230VAC -&gt; F1/MOV -&gt; autonomous soft-start -&gt; KBPC5010</text>
<text x="675.00" y="534.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">HV_DC- = HOT_GND только внутри опасного домена</text>
<text x="675.00" y="545.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">PE идет только на корпус/раму/двигатель, не на HV_DC-</text>
<text x="675.00" y="557.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">HLK-20M15 питает горячие 15V/12V/5V/3.3V</text>
<rect x="665.00" y="646.89" width="460.00" height="80.00" rx="6" fill="#ffe1df" stroke="#a32b28" stroke-width="1.8"/>
<text x="675.00" y="664.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">Запрещено при поданной HV</text>
<text x="675.00" y="682.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">USB Blue Pill, обычный ST-Link, прямой Saleae, заземленный осциллограф</text>
<text x="675.00" y="694.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">Любая пайка и перестановка проводов - только после разряда DC-шины</text>
