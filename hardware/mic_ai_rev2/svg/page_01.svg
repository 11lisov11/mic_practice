<text x="36.00" y="38.00" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#163c32">MIC_AI REV 2.2</text>
<text x="235.00" y="37.00" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#172126">Архитектура и домены земли</text>
<text x="36.00" y="58.00" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#4b5f59">Каноническая схема: SAFE_GND никогда напрямую не соединяется с HV_DC-/HOT_GND</text>
