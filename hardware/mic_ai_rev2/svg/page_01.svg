<text x="48.00" y="136.89" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#195747">SAFE DOMAIN</text>
<text x="401.00" y="136.89" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#9a5a0d">ISOLATION BARRIER</text>
<text x="650.00" y="136.89" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#8d211f">HOT / HV DOMAIN</text>
<rect x="58.00" y="171.89" width="265.00" height="100.00" rx="6" fill="#ffffff" stroke="#35524a" stroke-width="1.8"/>
<text x="68.00" y="189.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">UNO Q / ПК</text>
<text x="68.00" y="207.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">Питание UNO Q: VIN 7-24V или USB-C</text>
<text x="68.00" y="219.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">3.3V и 5V на UNO Q не подпитывать</text>
<text x="68.00" y="230.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">UART source: UNO Q либо PC USB-UART</text>
<rect x="58.00" y="321.89" width="265.00" height="100.00" rx="6" fill="#ffffff" stroke="#35524a" stroke-width="1.8"/>
<text x="68.00" y="339.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">Saleae Logic</text>
<text x="68.00" y="357.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">Только SAFE_GND</text>
<text x="68.00" y="369.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">CH0..CH7 после ISO7740F</text>
<text x="68.00" y="380.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">Изоляционная задержка не более десятков нс</text>
<rect x="58.00" y="471.89" width="265.00" height="100.00" rx="6" fill="#ffffff" stroke="#35524a" stroke-width="1.8"/>
<text x="68.00" y="489.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">Аппаратный PWM inhibit</text>
<text x="68.00" y="507.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">Нормально-замкнутый изолированный контур</text>
<text x="68.00" y="519.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">Обрыв питания/провода = PWM STOP</text>
<text x="68.00" y="530.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">Настоящий E-STOP также отключает сетевой контактор</text>
<rect x="58.00" y="621.89" width="265.00" height="100.00" rx="6" fill="#ffffff" stroke="#35524a" stroke-width="1.8"/>
<text x="68.00" y="639.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">SAFE питание</text>
<text x="68.00" y="657.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">SAFE_GND отдельно от PE и HOT_GND</text>
<text x="68.00" y="669.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">SAFE_3V3: UNO Q OUT либо внешний источник</text>
<text x="68.00" y="680.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">SAFE_5V питает только E-STOP loop</text>
<rect x="413.00" y="176.89" width="160.00" height="110.00" rx="6" fill="#fffdf8" stroke="#be761b" stroke-width="1.8"/>
<text x="423.00" y="194.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">U_UART_ISO</text>
<text x="423.00" y="212.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">ISO7721DWR</text>
<text x="423.00" y="224.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">UART 1 канал туда</text>
<text x="423.00" y="235.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">1 канал обратно</text>
<text x="423.00" y="247.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">8 mm creepage package</text>
<rect x="413.00" y="331.89" width="160.00" height="120.00" rx="6" fill="#fffdf8" stroke="#be761b" stroke-width="1.8"/>
<text x="423.00" y="349.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">U_LA1 + U_LA2</text>
<text x="423.00" y="367.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">2 x ISO7740FDWR</text>
<text x="423.00" y="379.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">8 hot-to-safe channels</text>
<text x="423.00" y="390.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">PWM/EM_STOP/reserved</text>
<text x="423.00" y="402.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">default LOW</text>
<rect x="413.00" y="501.89" width="160.00" height="95.00" rx="6" fill="#fffdf8" stroke="#be761b" stroke-width="1.8"/>
<text x="423.00" y="519.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">U_ESTOP_OPTO</text>
<text x="423.00" y="537.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">LTV-817</text>
<text x="423.00" y="549.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">Безопасный loop</text>
<text x="423.00" y="560.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">74LVC1G14 + AND</text>
