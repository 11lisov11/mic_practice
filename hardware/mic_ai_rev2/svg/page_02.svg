<text x="45.00" y="633.89" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="start" fill="#8a5315">HOT_15V существует только после JP_HOT15_SRC; внешний БП отключить перед подачей сети/HV.</text>
