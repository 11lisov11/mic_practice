<text x="190.00" y="699.89" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#612321">Проверить омметром: AC_L-AC_N не КЗ; BR1 AC1/AC2 не соединены с MINUS; SAFE_GND изолирован от HOT_GND.</text>
<text x="60.00" y="721.89" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#612321">F1 выбирается только после известного тока двигателя и сечения проводов. Не увеличивать номинал для маскировки ошибки.</text>
<text x="60.00" y="741.89" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#612321">PCB/layout требует отдельного DRC по creepage/clearance, прорезей и ширины HV дорожек. Эта принципиальная схема не заменяет layout review.</text>
