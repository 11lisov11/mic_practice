<rect x="45.00" y="526.89" width="260.00" height="150.00" rx="6" fill="#eef8f4" stroke="#35524a" stroke-width="1.8"/>
<text x="55.00" y="544.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">Safe NC PWM-inhibit loop</text>
<text x="55.00" y="562.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">SAFE_5V -&gt; NC switch -&gt; 680R</text>
<text x="55.00" y="574.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">-&gt; LTV-817 LED -&gt; SAFE_GND</text>
<text x="55.00" y="585.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">Обрыв loop или SAFE_5V</text>
<text x="55.00" y="597.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">аппаратно запрещает PWM RUN</text>
<text x="55.00" y="608.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">E-STOP также размыкает внешний контактор</text>
<rect x="395.00" y="521.89" width="240.00" height="160.00" rx="6" fill="#fff7e8" stroke="#b36b16" stroke-width="1.8"/>
<text x="405.00" y="539.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">Barrier + hot logic</text>
<text x="405.00" y="557.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">LTV-817 collector + 10K pull-up</text>
<text x="405.00" y="569.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">74LVC1G14: loop OK</text>
<text x="405.00" y="580.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">74LVC1G08: PB12 AND loop OK</text>
<text x="405.00" y="592.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">220R to STEVAL J2-1</text>
<text x="405.00" y="603.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">47K pulldown = shutdown by default</text>
<rect x="725.00" y="536.89" width="400.00" height="130.00" rx="6" fill="#ffe4e2" stroke="#a32b28" stroke-width="1.8"/>
<text x="735.00" y="554.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">Hardware interlock truth table</text>
<text x="735.00" y="572.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">PB12 LOW -&gt; J2-1 LOW -&gt; PWM STOP</text>
<text x="735.00" y="584.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">NC loop open -&gt; J2-1 LOW -&gt; PWM STOP</text>
<text x="735.00" y="595.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">Hot logic power lost -&gt; output pulldown -&gt; STOP</text>
<text x="735.00" y="607.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">RUN only when PB12 HIGH and loop closed</text>
<text x="735.00" y="618.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">Software cannot override an open loop</text>
