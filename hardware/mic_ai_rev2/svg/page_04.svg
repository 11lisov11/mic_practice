<text x="55.00" y="349.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">Safe Saleae</text>
<text x="55.00" y="367.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">J_SALEAE CH0..CH7 + SAFE_GND</text>
<text x="55.00" y="379.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">CH0..5 complementary PWM</text>
<text x="55.00" y="390.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">CH6 PB12 command</text>
<text x="55.00" y="402.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">CH7 reserved, expected LOW</text>
<rect x="395.00" y="326.89" width="240.00" height="130.00" rx="6" fill="#fff7e8" stroke="#b36b16" stroke-width="1.8"/>
<text x="405.00" y="344.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">2 x ISO7740FDWR</text>
<text x="405.00" y="362.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">CH0..CH3 via U_LA1</text>
<text x="405.00" y="374.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">CH4..CH7 via U_LA2</text>
<text x="405.00" y="385.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">EN2 (pin 10) -&gt; SAFE_3V3</text>
<text x="405.00" y="397.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">100Mbps / default LOW</text>
<text x="405.00" y="408.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">2000ns deadtime remains measurable</text>
<rect x="725.00" y="331.89" width="400.00" height="120.00" rx="6" fill="#fff0ef" stroke="#a32b28" stroke-width="1.8"/>
<text x="735.00" y="349.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">Hot monitor taps</text>
<text x="735.00" y="367.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">CH0 PWM_UH after 33R</text>
<text x="735.00" y="379.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">CH1 PWM_UL after 33R</text>
<text x="735.00" y="390.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">CH2 PWM_VH / CH3 PWM_VL</text>
<text x="735.00" y="402.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">CH4 PWM_WH / CH5 PWM_WL</text>
<text x="735.00" y="413.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">CH6 PB12_RUN / CH7 reserved LOW</text>
