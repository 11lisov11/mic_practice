<text x="1154.55" y="821.89" font-family="Arial, sans-serif" font-size="8" font-weight="400" text-anchor="end" fill="#5b6965">Лист 4/6   2026-08-26</text>
<rect x="45.00" y="156.89" width="260.00" height="105.00" rx="6" fill="#eef8f4" stroke="#35524a" stroke-width="1.8"/>
<text x="55.00" y="174.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">UART source select</text>
<text x="55.00" y="192.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">JP_UART_TX / JP_UART_RX</text>
<text x="55.00" y="204.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">Позиция UNO Q: D1 TX / D0 RX</text>
<text x="55.00" y="215.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">Позиция PC: USB-UART 3.3V logic</text>
<text x="55.00" y="227.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">Power pin USB-UART = NC</text>
<rect x="395.00" y="151.89" width="240.00" height="115.00" rx="6" fill="#fff7e8" stroke="#b36b16" stroke-width="1.8"/>
<text x="405.00" y="169.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">U_UART_ISO</text>
<text x="405.00" y="187.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">ISO7721DWR wide-body</text>
<text x="405.00" y="199.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">SAFE TX -&gt; HOT PA3 RX</text>
<text x="405.00" y="210.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">HOT PA2 TX -&gt; SAFE RX</text>
<text x="405.00" y="222.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">100nF с обеих сторон</text>
<rect x="725.00" y="156.89" width="400.00" height="105.00" rx="6" fill="#fff0ef" stroke="#a32b28" stroke-width="1.8"/>
<text x="735.00" y="174.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">Blue Pill USART2</text>
<text x="735.00" y="192.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">PA3 = RX commands</text>
<text x="735.00" y="204.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">PA2 = TX telemetry</text>
<text x="735.00" y="215.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">115200 8N1</text>
<text x="735.00" y="227.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">CRC/timeout remain active across isolator</text>
