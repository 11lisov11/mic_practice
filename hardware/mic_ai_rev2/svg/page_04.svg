<line x1="395.00" y1="601.89" x2="387.53" y2="596.87" stroke="#1f6252" stroke-width="2"/>
<line x1="395.00" y1="601.89" x2="387.53" y2="606.91" stroke="#1f6252" stroke-width="2"/>
<line x1="635.00" y1="601.89" x2="725.00" y2="601.89" stroke="#1f6252" stroke-width="2"/>
<line x1="725.00" y1="601.89" x2="717.53" y2="596.87" stroke="#1f6252" stroke-width="2"/>
<line x1="725.00" y1="601.89" x2="717.53" y2="606.91" stroke="#1f6252" stroke-width="2"/>
<text x="45.00" y="726.89" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="start" fill="#28463e">SAFE_3V3 выбирается джампером: UNO Q OUT_3V3 либо внешний safe 3.3V. Это выход UNO Q, не вход питания платы.</text>
<text x="45.00" y="746.89" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="start" fill="#8f211e">Wide-body isolators и прорезь/keepout под barrier обязательны на PCB; дорожки или полигоны под корпусами изоляторов запрещены.</text>
</svg>