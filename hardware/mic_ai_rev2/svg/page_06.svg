<svg xmlns="http://www.w3.org/2000/svg" width="1191" height="842" viewBox="0 0 1191 842">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="36.00" y="38.00" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#163c32">MIC_AI REV 2.1</text>
<text x="235.00" y="37.00" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#172126">Контроль физических выводов</text>
<text x="36.00" y="58.00" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#4b5f59">Номера указаны для выбранных корпусов; ориентацию всегда проверять по метке pin 1 на корпусе</text>
<line x1="36.00" y1="68.00" x2="1154.55" y2="68.00" stroke="#286f5d" stroke-width="2"/>
<text x="1154.55" y="821.89" font-family="Arial, sans-serif" font-size="8" font-weight="400" text-anchor="end" fill="#5b6965">Лист 6/6   2026-07-17</text>
<rect x="45.00" y="141.89" width="335.00" height="180.00" rx="6" fill="#fff7e8" stroke="#b36b16" stroke-width="1.8"/>
<text x="55.00" y="159.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">U_UART_ISO: ISO7721DWR</text>
<text x="55.00" y="177.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">1,7 GND1 -&gt; SAFE_GND; 3 VCC1 -&gt; SAFE_3V3</text>
<text x="55.00" y="189.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">4 OUTA -&gt; SAFE RX; 5 INB &lt;- SAFE TX</text>
<text x="55.00" y="200.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">9,16 GND2 -&gt; HOT_GND; 14 VCC2 -&gt; HOT_3V3</text>
<text x="55.00" y="212.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">12 OUTB -&gt; PA3 RX; 13 INA &lt;- PA2 TX</text>
<text x="55.00" y="223.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">2,6,8,10,11,15 = NC</text>
<text x="55.00" y="235.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">Корпус DW-16 wide-body, вид сверху</text>
<rect x="420.00" y="141.89" width="350.00" height="200.00" rx="6" fill="#fff7e8" stroke="#b36b16" stroke-width="1.8"/>
<text x="430.00" y="159.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">U_LA1/U_LA2: ISO7740FDWR</text>
<text x="430.00" y="177.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">1 VCC1 -&gt; HOT_3V3; 2,8 GND1 -&gt; HOT_GND</text>
<text x="430.00" y="189.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">3 INA / 4 INB / 5 INC / 6 IND &lt;- HOT signals</text>
<text x="430.00" y="200.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">7 = NC</text>
<text x="430.00" y="212.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">9,15 GND2 -&gt; SAFE_GND; 16 VCC2 -&gt; SAFE_3V3</text>
<text x="430.00" y="223.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">10 EN2 -&gt; SAFE_3V3 (выходы разрешены)</text>
<text x="430.00" y="235.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">14 OUTA / 13 OUTB / 12 OUTC / 11 OUTD -&gt; Saleae</text>
<text x="430.00" y="246.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">Суффикс F: при потере входа выход LOW</text>
<rect x="810.00" y="141.89" width="315.00" height="200.00" rx="6" fill="#fff7e8" stroke="#b36b16" stroke-width="1.8"/>
<text x="820.00" y="159.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">Аппаратный PWM inhibit</text>
<text x="820.00" y="177.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">LTV-817: 1 LED_A, 2 LED_K, 3 E, 4 C</text>
<text x="820.00" y="189.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">SN74LVC1G14DBVR: 1 NC, 2 A, 3 GND, 4 Y, 5 VCC</text>
<text x="820.00" y="200.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">SN74LVC1G08DBVR: 1 A, 2 B, 3 GND, 4 Y, 5 VCC</text>
<text x="820.00" y="212.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">DBV = SOT-23-5, вид сверху</text>
<text x="820.00" y="223.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">J2-1 имеет 47K pulldown: питание пропало -&gt; STOP</text>
<rect x="45.00" y="386.89" width="335.00" height="170.00" rx="6" fill="#fff0ef" stroke="#a32b28" stroke-width="1.8"/>
<text x="55.00" y="404.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">Драйвер K1</text>
<text x="55.00" y="422.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">Q1 AO3400A: 1 G, 2 S, 3 D</text>
<text x="55.00" y="434.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">D_K1 SS14: полоса = K -&gt; HOT_12V</text>
<text x="55.00" y="445.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">K1 TE 2-1904058-5: 12V, coil 50R</text>
<text x="55.00" y="457.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">K1 contact: 400VDC / 20A</text>
<text x="55.00" y="468.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">Посадочное место K1 брать только из TE CAD</text>
<text x="55.00" y="480.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">Катушка не содержит встроенного резистора</text>
<rect x="420.00" y="386.89" width="350.00" height="170.00" rx="6" fill="#fff7e8" stroke="#b36b16" stroke-width="1.8"/>
<text x="430.00" y="404.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">Вентилятор</text>
<text x="430.00" y="422.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">Q_FAN_N MMBT2222A-7-F: 1 B, 2 E, 3 C</text>
<text x="430.00" y="434.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">J_FAN: 1 GND, 2 +12V, 3 TACH, 4 PWM</text>
<text x="430.00" y="445.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">PWM = open collector, 25kHz</text>
<text x="430.00" y="457.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">PA11 принимает TACH через 1K</text>
<text x="430.00" y="468.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">3-pin fan: только pins 1..3, без регулирования</text>
<rect x="810.00" y="386.89" width="315.00" height="170.00" rx="6" fill="#fff0ef" stroke="#a32b28" stroke-width="1.8"/>
<text x="820.00" y="404.89" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#153b32">Силовые маркировки</text>
<text x="820.00" y="422.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">BR1: использовать только marks ~, ~, +, - на корпусе</text>
<text x="820.00" y="434.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">J7: PLUS -&gt; DC+, MINUS -&gt; DC- / HOT_GND</text>
<text x="820.00" y="445.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">SS14: полоса на корпусе обозначает катод</text>
<text x="820.00" y="457.39" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">PE никогда не соединять с HOT_GND на этой плате</text>
<text x="820.00" y="468.89" font-family="Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#24332f">SAFE_GND никогда не соединять с HOT_GND</text>
<rect x="45.00" y="611.89" width="1080.00" height="125.00" rx="6" fill="#ffe4e2" stroke="#a32b28" stroke-width="2"/>
<text x="60.00" y="637.89" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8f211e">ОБЯЗАТЕЛЬНО ПЕРЕД ПАЙКОЙ</text>
<text x="60.00" y="659.89" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#612321">1. Сверить фактический MPN каждой микросхемы с MIC_AI_REV2_PINMAP.csv; заменять производителя без повторной проверки pinout нельзя.</text>
<text x="60.00" y="680.89" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#612321">2. Для K1 импортировать официальный TE CAD/footprint 2-1904058-5 и вручную сопоставить две силовые площадки и две площадки катушки.</text>
<text x="60.00" y="701.89" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#612321">3. После разводки выполнить ERC/DRC, проверку creepage/clearance и прозвонку SAFE_GND - HOT_GND - PE - AC_N как четырех разных сетей.</text>
<text x="60.00" y="722.89" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#612321">4. Номинал F1 остаётся F1_VALUE_BY_LOAD до расчёта по двигателю, проводам и допустимому току входа.</text>
</svg>