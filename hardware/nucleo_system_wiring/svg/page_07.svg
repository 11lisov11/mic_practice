<text x="38.00" y="66.00" font-family="Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start" fill="#333333">Краткий маршрут сборки без чтения README</text>
<line x1="28.00" y1="78.00" x2="1162.55" y2="78.00" stroke="#111111" stroke-width="1.0"/>
