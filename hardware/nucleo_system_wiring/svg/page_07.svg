<text x="658.55" y="774.89" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" text-anchor="start" fill="#111111">Схема электрическая подключений</text>
<text x="658.55" y="805.89" font-family="Arial, sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#111111">MIC_AI: Nucleo — IHM09M2 — IPM15B</text>
<text x="943.55" y="774.89" font-family="Arial, sans-serif" font-size="8" font-weight="700" text-anchor="start" fill="#111111">MIC-AI.Э4.NUCLEO.001</text>
<text x="943.55" y="805.89" font-family="Arial, sans-serif" font-size="7.5" font-weight="400" text-anchor="start" fill="#111111">Рев. 1.0   2026-08-26</text>
<text x="1063.55" y="774.89" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" text-anchor="start" fill="#111111">Лист 7</text>
<text x="1063.55" y="805.89" font-family="Arial, sans-serif" font-size="7.5" font-weight="400" text-anchor="start" fill="#111111">Листов 7   A3</text>
<text x="32.00" y="804.89" font-family="Arial, sans-serif" font-size="7.2" font-weight="400" text-anchor="start" fill="#111111">Э4-подобный монтажный документ; не сертифицированный комплект КД</text>
<rect x="45.00" y="121.89" width="520.00" height="290.00" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<rect x="45.00" y="121.89" width="520.00" height="24.00" fill="#f4f4f4" stroke="#111111" stroke-width="1.0"/>
<text x="53.00" y="138.89" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#111111">Последовательность 1</text>
<text x="53.00" y="160.89" font-family="Arial, sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#111111">1. Проверить маркировку плат: G431RB, IHM09M2, IPM15B.</text>
<text x="53.00" y="172.39" font-family="Arial, sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#111111">2. Выставить IHM09M2 J1 OFF.</text>
<text x="53.00" y="183.89" font-family="Arial, sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#111111">3. Выставить STEVAL: SW3 2-3; SW1/2/4 1-2.</text>
<text x="53.00" y="195.39" font-family="Arial, sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#111111">4. STEVAL: SW5/6 open; SW7/8 closed.</text>
<text x="53.00" y="206.89" font-family="Arial, sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#111111">5. Установить IHM09M2 на CN7/CN10 Nucleo.</text>
<text x="53.00" y="218.39" font-family="Arial, sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#111111">6. Прозвонить FC-34P 1:1; отметить красную жилу pin 1.</text>
<text x="53.00" y="229.89" font-family="Arial, sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#111111">7. Соединить IHM09 J7 с STEVAL J2.</text>
<text x="53.00" y="241.39" font-family="Arial, sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#111111">8. Собрать прямой UART и общую HOT_GND внутри корпуса.</text>
<text x="53.00" y="252.89" font-family="Arial, sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#111111">9. Подать 15 V на J4/UNO Q и 9 V на VIN без J7/HV.</text>
<text x="53.00" y="264.39" font-family="Arial, sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#111111">10. Настроить station/AP, ключ HMI и автозапуск сервиса.</text>
<rect x="605.00" y="121.89" width="520.00" height="290.00" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<rect x="605.00" y="121.89" width="520.00" height="24.00" fill="#f4f4f4" stroke="#111111" stroke-width="1.0"/>
<text x="613.00" y="138.89" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#111111">Последовательность 2</text>
<text x="613.00" y="160.89" font-family="Arial, sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#111111">11. Собрать AIR56B2 треугольником 220 V.</text>
<text x="613.00" y="172.39" font-family="Arial, sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#111111">12. J3-1/2/3 -&gt; U1/V1/W1; PE -&gt; корпус.</text>
<text x="613.00" y="183.89" font-family="Arial, sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#111111">13. Собрать QF/F1/MOV/soft-start/BR1/DC-link.</text>
<text x="613.00" y="195.39" font-family="Arial, sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#111111">14. Проверить bleeder и измеряемое время разряда.</text>
<text x="613.00" y="206.89" font-family="Arial, sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#111111">15. Полностью убрать USB/ST-Link/Ethernet и приборы ПК.</text>
<text x="613.00" y="218.39" font-family="Arial, sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#111111">16. Первый силовой тест — ограниченный и ограждённый.</text>
<text x="613.00" y="229.89" font-family="Arial, sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#111111">17. Контролировать Vbus, ток, температуру, шум и вибрацию.</text>
<text x="613.00" y="241.39" font-family="Arial, sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#111111">18. При fault/тайм-ауте PWM обязан отключиться.</text>
<text x="613.00" y="252.89" font-family="Arial, sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#111111">19. AS5600 подключать только после принятия S1.</text>
<text x="613.00" y="264.39" font-family="Arial, sans-serif" font-size="8.2" font-weight="400" text-anchor="start" fill="#111111">20. Проверить останов при потере Wi-Fi/heartbeat; записать HIL.</text>
<rect x="90.00" y="451.89" width="280.00" height="20.00" fill="#e9e9e9" stroke="#666666" stroke-width="0.8"/>
