[platformio]
default_envs = nucleo_g431_uart_bridge

[env:nucleo_g431_uart_bridge]
platform = ststm32
board = nucleo_g431rb
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
build_flags =
    -DMIC_MOTOR_BACKEND_STUB=1
    -DMIC_MOTOR_BACKEND_PWM_BENCH=0
    -DNUCLEO_MOTOR_CLOCK_170MHZ=0
    -DNUCLEO_BRIDGE_STATUS_LED=1
    -DNUCLEO_UART_USE_STLINK_VCP=0

; Safe stub reachable through the integrated STLINK-V3E virtual COM port.
[env:nucleo_g431_uart_bridge_vcp]
extends = env:nucleo_g431_uart_bridge
build_flags =
    -DMIC_MOTOR_BACKEND_STUB=1
    -DMIC_MOTOR_BACKEND_PWM_BENCH=0
    -DNUCLEO_MOTOR_CLOCK_170MHZ=0
    -DNUCLEO_BRIDGE_STATUS_LED=1
    -DNUCLEO_UART_USE_STLINK_VCP=1

; Low-voltage logic-analyzer build only. J7 must be disconnected from the
; power board. This profile never releases PA6/J7-1 EM_STOP.
[env:nucleo_g431_pwm_bench]
extends = env:nucleo_g431_uart_bridge
build_flags =
    -DMIC_MOTOR_BACKEND_STUB=0
    -DMIC_MOTOR_BACKEND_PWM_BENCH=1
    -DNUCLEO_MOTOR_CLOCK_170MHZ=1
    -DNUCLEO_BRIDGE_STATUS_LED=1
    -DNUCLEO_UART_USE_STLINK_VCP=0

; Same fail-closed PWM/CPU benchmark, controlled only through STLINK VCP.
[env:nucleo_g431_pwm_bench_vcp]
extends = env:nucleo_g431_uart_bridge
build_flags =
    -DMIC_MOTOR_BACKEND_STUB=0
    -DMIC_MOTOR_BACKEND_PWM_BENCH=1
    -DNUCLEO_MOTOR_CLOCK_170MHZ=1
    -DNUCLEO_BRIDGE_STATUS_LED=1
    -DNUCLEO_UART_USE_STLINK_VCP=1
