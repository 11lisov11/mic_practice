# Boot recovery only: expected 1106 was separately copied and hash-checked.
reset_config srst_only srst_nogate srst_push_pull connect_assert_srst
init
reset
halt
set recovery_failed [catch {
    flash verify_image ${filename0}
    flash verify_image /home/arduino/mic_expected_boot_1106.bin 0x08100000 bin
    flash write_image erase ${filename1} 0x08100000 bin
    flash verify_image ${filename1} 0x08100000 bin
} recovery_error]
if {$recovery_failed} {
    echo "UNO boot recovery FAILED: $recovery_error"
    shutdown error
} else {
    echo "UNO predecessor and recovery image verification PASSED"
    reset
    sleep 100
    mww 0x40036400 0xCAFFEEEE
    shutdown
}
