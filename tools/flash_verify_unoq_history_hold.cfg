# Paired baud change: verify existing loader, write/verify sketch, leave HALTED.
# Native1804 must be installed before the separate verify/restart recipe.
reset_config srst_only srst_nogate srst_push_pull connect_assert_srst
init
reset
halt
set programming_failed [catch {
    flash verify_image ${filename0}
    flash write_image erase ${filename1} 0x08100000 bin
    flash verify_image ${filename1} 0x08100000 bin
} programming_error]
if {$programming_failed} {
    echo "UNO Q history programming FAILED; core left halted: $programming_error"
    shutdown error
} else {
    halt
    echo "UNO Q history sketch VERIFIED AND HELD; no mixed-baud application running"
    shutdown
}
