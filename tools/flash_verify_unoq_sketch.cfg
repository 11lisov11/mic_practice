# Arduino Zephyr remoteocd: filename0=loader, filename1=sketch.
# Keep the installed flash recipe's boot sequence, but verify after every write.
reset_config srst_only srst_nogate srst_push_pull connect_assert_srst
init
reset
halt
flash info 0
set flash_failed [catch {
    if {[catch {flash verify_image ${filename0}}] != 0} {
        flash write_image erase ${filename0}
    }
    flash verify_image ${filename0}
    if {[catch {flash verify_image ${filename1} 0x08100000 bin}] != 0} {
        flash write_image erase ${filename1} 0x08100000 bin
    }
    flash verify_image ${filename1} 0x08100000 bin
} flash_error]
if {$flash_failed} {
    echo "UNO Q programming/verification FAILED: $flash_error"
    shutdown error
} else {
    echo "UNO Q loader and sketch verification PASSED"
    reset
    sleep 100
    mww 0x40036400 0xCAFFEEEE
    shutdown
}
