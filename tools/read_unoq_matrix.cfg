# Read the running LED framebuffer only. No reset, halt, writes or flash.
reset_config none
init
echo "MATRIX_FRAMEBUFFER_BEGIN"
echo [read_memory 0x20001228 32 4]
echo "MATRIX_FRAMEBUFFER_END"
echo "MATRIX_SCAN_BEGIN"
for {set i 0} {$i < 8} {incr i} {
    echo [read_memory 0x20001714 32 1]
    sleep 17
}
echo "MATRIX_SCAN_END"
shutdown
