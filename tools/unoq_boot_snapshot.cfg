# Read-only boot diagnosis on a physically deenergized stand. Resume after halt.
$_CHIPNAME.ap0 configure -event examine-end {}
$_TARGETNAME configure -event examine-end {}
init
targets $_TARGETNAME
poll
echo "CORE_STATE_BEFORE: [$_TARGETNAME curstate]"
set snapshot_failed [catch {
    halt
    wait_halt 2000
    echo "PC: [reg pc]"
    echo "LR: [reg lr]"
    echo "SP: [reg sp]"
    echo "XPSR: [reg xpsr]"
    echo "SCB_ICSR: [read_memory 0xe000ed04 32 1]"
    echo "SCB_VTOR: [read_memory 0xe000ed08 32 1]"
    echo "SCB_FAULTS: [read_memory 0xe000ed28 32 6]"
    echo "BACKUP_BOOT_FLAG: [read_memory 0x40036400 32 1]"
    # Addresses from the flash-verified Arduino Zephyr 0.90.0 loader ELF.
    echo "MAIN_THREAD: [read_memory 0x20001360 32 66]"
    echo "KERNEL: [read_memory 0x20001e30 32 16]"
    set main_psp [lindex [read_memory 0x200013b0 32 1] 0]
    if {$main_psp >= 0x20042968 && $main_psp <= 0x2004a768} {
        echo "MAIN_SAVED_STACK: [read_memory $main_psp 32 64]"
    }
} snapshot_error]
resume
echo "CORE_STATE_AFTER: [$_TARGETNAME curstate]"
if {$snapshot_failed} {echo "SNAPSHOT_ERROR: $snapshot_error"}
shutdown
