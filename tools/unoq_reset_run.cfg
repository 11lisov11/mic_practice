# Release the Uno Q application MCU after a readback-only OpenOCD session.
# This performs a reset and resumes execution; it does not write flash.
reset_config srst_only srst_nogate srst_push_pull connect_assert_srst
init
echo "CORE_BEFORE_RESET: [$_TARGETNAME curstate]"
reset run
sleep 100
echo "CORE_AFTER_RESET_RUN: [$_TARGETNAME curstate]"
shutdown
