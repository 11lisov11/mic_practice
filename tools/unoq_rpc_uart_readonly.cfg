# No reset/halt/writes; never read RDR (would consume received data).
$_CHIPNAME.ap0 configure -event examine-end {}
$_TARGETNAME configure -event examine-end {}
init
echo "CORE_BEFORE: [$_TARGETNAME curstate]"
echo "LPUART1_CONFIG_ISR: [read_memory 0x46002400 32 8]"
echo "USART1_CONFIG_ISR: [read_memory 0x40013800 32 8]"
echo "GPIOG_MODE_AF: [read_memory 0x42021800 32 10]"
sleep 300
echo "LPUART1_AGAIN: [read_memory 0x46002400 32 8]"
echo "CORE_AFTER: [$_TARGETNAME curstate]"
shutdown
