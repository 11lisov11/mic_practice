# For /opt/openocd/openocd_gpiod.cfg on UNO Q. No reset, halt or flash writes.
$_CHIPNAME.ap0 configure -event examine-end {}
$_TARGETNAME configure -event examine-end {}
init
targets $_TARGETNAME
echo "CORE_STATE_BEFORE: [$_TARGETNAME curstate]"
echo "GPIOB_CONFIG: [read_memory 0x42020400 32 11]"
echo "USART1_CONFIG: [read_memory 0x40013800 32 8]"
set lows [lrepeat 16 0]
set changes [lrepeat 16 0]
set previous -1
for {set sample 0} {$sample < 3000} {incr sample} {
    set value [lindex [read_memory 0x42020410 32 1] 0]
    for {set bit 0} {$bit < 16} {incr bit} {
        if {($value & (1 << $bit)) == 0} {lset lows $bit [expr {[lindex $lows $bit] + 1}]}
        if {$previous >= 0 && (($value ^ $previous) & (1 << $bit)) != 0} {
            lset changes $bit [expr {[lindex $changes $bit] + 1}]
        }
    }
    set previous $value
}
echo "SAMPLES: 3000"
echo "PB_LOW_COUNTS: $lows"
echo "PB_OBSERVED_CHANGES: $changes"
echo "USART1_AFTER: [read_memory 0x40013800 32 8]"
echo "CORE_STATE_AFTER: [$_TARGETNAME curstate]"
shutdown
