# Verify the installed images and restart only; never erase or write flash.
reset_config srst_only srst_nogate srst_push_pull connect_assert_srst
init
reset
halt
set check_failed [catch {
    flash verify_image ${filename0}
    flash verify_image ${filename1} 0x08100000 bin
} check_error]
if {$check_failed} {
    echo "UNO Q verification FAILED; no flash write performed: $check_error"
    shutdown error
} else {
    dump_image /tmp/mic_rpc2011_flash_readback_20261120_r1.bin 0x08100000 184076
    echo "UNO Q verification PASSED; restarting unchanged images"
    reset
    sleep 100
    mww 0x40036400 0xCAFFEEEE
    shutdown
}
