<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Управление двигателем UNOQ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg"></div>
  <main class="shell">
    <header class="hero">
      <div class="status-row">
        <div class="status-chip" id="connChip">
          <span class="dot" id="connDot"></span>
          <span id="connText">офлайн</span>
        </div>
        <div class="status-chip status-mode" id="sysChip">
          <span id="sysText">СТОП</span>
        </div>
      </div>
    </header>

    <section class="grid">
      <div class="panel controls">
        <div class="mode-row">
          <div class="label">Режим</div>
          <div class="segmented" id="modeToggle">
            <button class="seg" data-mode="VF">VF</button>
            <button class="seg" data-mode="FOC">FOC</button>
            <button class="seg" data-mode="MIC">MIC</button>
          </div>
        </div>
        <div class="button-row">
          <button class="btn start" id="startBtn">Пуск</button>
          <button class="btn stop" id="stopBtn">Стоп</button>
        </div>
        <div class="estop-block">
          <button class="btn estop full" id="estopBtn">Аварийный стоп</button>
        </div>

        <div class="io-block">
          <div class="label">IPM15 I/O</div>
          <div class="io-row">
            <button class="btn ghost" id="ntcBtn">NTC: OFF</button>
            <button class="btn ghost" id="pfcBtn">PFC: OFF</button>
          </div>
          <div class="brake-row">
            <input id="brakeSlider" type="range" min="0" max="1" step="0.05" value="0" />
            <div class="brake-readout" id="brakeReadout">BRK 0%</div>
          </div>
        </div>

        <div class="freq-block">
          <div class="label">Частота (Гц)</div>
          <div class="freq-row">
            <input id="freqSlider" type="range" min="0" max="50" step="0.1" value="10" />
          </div>
          <div class="freq-tooltip" id="freqReadout">10.0 Гц</div>
        </div>
      </div>

      <div class="panel status">
        <h2>Статус</h2>
        <div class="status-grid">
          <div class="card">
            <div class="card-label">Состояние</div>
            <div class="card-value" id="stateVal">SAFE</div>
          </div>
          <div class="card">
            <div class="card-label">Режим</div>
            <div class="card-value" id="modeVal">FOC</div>
          </div>
          <div class="card">
            <div class="card-label">ШИМ</div>
            <div class="card-value" id="pwmVal">0</div>
          </div>
          <div class="card">
            <div class="card-label">Скорость</div>
            <div class="card-value" id="speedVal">0 об/мин</div>
          </div>
          <div class="card">
            <div class="card-label">Шина DC</div>
            <div class="card-value" id="vdcVal">0.0 V</div>
          </div>
          <div class="card">
            <div class="card-label">Ia/Ib/Ic</div>
            <div class="card-value" id="currVal">0 / 0 / 0 A</div>
          </div>
          <div class="card">
            <div class="card-label">Id задано</div>
            <div class="card-value" id="idRefVal">0.00 A</div>
          </div>
          <div class="card">
            <div class="card-label">MIC экономия</div>
            <div class="card-value" id="micSaveVal">--</div>
          </div>
          <div class="card">
            <div class="card-label">NTC/PFC/BRK</div>
            <div class="card-value" id="ioVal">--</div>
          </div>
          <div class="card">
            <div class="card-label">Энкодер</div>
            <div class="card-value" id="encVal">--</div>
          </div>
        </div>
        <div class="status-footer">
          <span id="lastUpdate">Нет данных</span>
        </div>
      </div>
    </section>

    <section class="panel logs">
      <div class="log-row">
        <span class="log-title">Логи</span>
        <select id="logHours">
          <option value="1">1 час</option>
          <option value="6">6 часов</option>
          <option value="24" selected>24 часа</option>
        </select>
        <a id="logDownload" class="btn ghost" href="/api/logs?hours=24&download=1">Скачать</a>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
